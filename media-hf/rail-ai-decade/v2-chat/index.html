<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>질문과 답</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pretendard";
        src: local("Pretendard");
        font-weight: 100 900;
      }
      :root { background: #f3e6d8; color: #17140f; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font-family: "Pretendard", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f3e6d8; }
      .clip { position: absolute; inset: 0; }
      .sheet { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 404px; }
      .prompt { width: 1320px; min-height: 120px; border-bottom: 1px solid rgba(23, 20, 15, .62); display: flex; align-items: center; padding: 0 10px 20px; font-size: 54px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.28; white-space: nowrap; }
      .question { display: inline; }
      .char { display: inline-block; opacity: 0; }
      .cursor { width: 4px; height: 61px; margin-left: 5px; background: #1f4fbf; flex: 0 0 auto; }
      .answer { width: 1320px; margin-top: 48px; padding: 0 10px; color: #17140f; font-size: 44px; font-weight: 500; letter-spacing: -0.035em; line-height: 1.55; }
      .word { display: inline-block; opacity: 0; margin-right: .29em; }
      .word:last-child { margin-right: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="v2-chat" data-start="0" data-width="1920" data-height="1080" data-duration="6" data-fps="30">
      <main id="question-answer" aria-label="질문을 쓰면 답이 문장으로 흘러나온다">
        <div class="sheet">
          <div class="prompt" aria-label="질문 입력창"><span id="question" class="question"></span><i id="cursor" class="cursor" aria-hidden="true"></i></div>
          <div id="answer" class="answer" aria-label="답변"></div>
        </div>
      </main>
    </div>
    <script>
      const question = "트랜스포머를 한 문장으로 설명해 줘";
      const answer = "문장 속 모든 단어가 서로를 얼마나 참고할지 한 번에 계산해 읽는 신경망 구조입니다.";
      const questionHost = document.getElementById("question");
      const answerHost = document.getElementById("answer");
      const characters = Array.from(question).map((character) => {
        const span = document.createElement("span");
        span.className = "char";
        span.textContent = character === " " ? "\u00a0" : character;
        questionHost.appendChild(span);
        return span;
      });
      const words = answer.split(" ").map((word) => {
        const span = document.createElement("span");
        span.className = "word";
        span.textContent = word;
        answerHost.appendChild(span);
        return span;
      });
      const tl = gsap.timeline({ paused: true });
      const questionStart = 0.24;
      const questionEnd = 2.28;
      const charDuration = 0.06;
      const charStep = (questionEnd - questionStart - charDuration) / (characters.length - 1);
      characters.forEach((character, index) => {
        tl.to(character, { opacity: 1, duration: charDuration, ease: "none" }, questionStart + index * charStep);
      });
      const answerStart = 2.38;
      const answerEnd = 5.70;
      const wordDuration = 0.15;
      const wordStep = (answerEnd - answerStart - wordDuration) / (words.length - 1);
      words.forEach((word, index) => {
        tl.to(word, { opacity: 1, duration: wordDuration, ease: "power1.out" }, answerStart + index * wordStep);
      });
      window.__timelines["v2-chat"] = tl;
    </script>
  </body>
</html>
